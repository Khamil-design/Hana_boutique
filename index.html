<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hana Boutique — Configurateur</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">

    <!-- Polices -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Feuille de style -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

<header class="site-header">

    <div class="container py-3 d-flex justify-content-between align-items-center">

        <div class="brand">

            <svg class="brand-emblem" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M50 52 C41 41 39 22 50 12 C61 22 59 41 50 52 Z" transform="rotate(0 50 50)"/>
                    <path d="M50 52 C41 41 39 22 50 12 C61 22 59 41 50 52 Z" transform="rotate(72 50 50)"/>
                    <path d="M50 52 C41 41 39 22 50 12 C61 22 59 41 50 52 Z" transform="rotate(144 50 50)"/>
                    <path d="M50 52 C41 41 39 22 50 12 C61 22 59 41 50 52 Z" transform="rotate(216 50 50)"/>
                    <path d="M50 52 C41 41 39 22 50 12 C61 22 59 41 50 52 Z" transform="rotate(288 50 50)"/>
                </g>
                <circle cx="50" cy="50" r="3.2" fill="currentColor" stroke="none"/>
            </svg>

            <div class="brand-text">
                <span class="brand-name">Hana</span>
                <span class="brand-subtitle">Boutique</span>
            </div>

        </div>

        <button
            class="btn btn-outline-gold position-relative"
            id="btnPanier"
            data-bs-toggle="offcanvas"
            data-bs-target="#panierCanvas">

            <i class="bi bi-cart3 fs-4"></i>

            <span
                id="cartBadge"
                class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">

                0

            </span>

        </button>

    </div>

</header>


    <!-- ================= CONTENU ================= -->

    <main class="container my-4">

        <!-- ================= SELECTEUR DE PRODUIT ================= -->

        <div class="row mb-4">

            <div class="col-md-5">

                <label for="productSelector" class="form-label fw-semibold">

                    Choisir un produit

                </label>

                <select
                    id="productSelector"
                    class="form-select">

                    <!-- Options générées automatiquement par JavaScript -->

                </select>

            </div>

        </div>

        <div class="row">

            <!-- IMAGE PRODUIT -->
            <!-- src="images/placeholder.jpg" -->

            <div class="col-lg-5">

                <div class="card shadow-sm">

                <div class="gallery">

    <div
        id="galleryThumbs"
        class="gallery-thumbs">

    </div>

    <div class="gallery-viewer">

        <button
            id="galleryPrev"
            class="gallery-btn">

            ❮

        </button>

        <img
            id="productImage"
            class="img-fluid">

        <button
            id="galleryNext"
            class="gallery-btn">

            ❯

        </button>

    </div>

</div>
                    
                    <!--<img
                        id="productImage"
                        class="card-img-top img-fluid"
                        src="images/""
                        
                        alt="Produit">-->

                    <div class="card-body">

                        <h2 id="productTitle" class="product-title mb-2">

                            Chargement...

                        </h2>

                        <p id="productDescription" class="text-muted mb-0">

                            Description...

                        </p>

                    </div>

                </div>

            </div>



            <!-- CONFIGURATION -->

            <div class="col-lg-7">

                <div class="card shadow-sm">

                    <div class="card-header">

                        <h4 class="mb-0">

                            Personnalisation

                        </h4>

                    </div>

                    <div class="card-body">

                        <!--
                            Les options seront générées
                            automatiquement par JavaScript
                        -->

                        <form id="configForm">

                        </form>

                    </div>

                </div>

            </div>

        </div>



        <!-- ================= RECAP ================= -->

        <div class="row mt-4">

            <div class="col-12">

                <div class="card shadow">

                    <div class="card-header">

                        <h4 class="mb-0">

                            Récapitulatif

                        </h4>

                    </div>

                    <div class="card-body">

                        <div id="summary">

                            <!-- Généré automatiquement -->

                        </div>

                    </div>

                </div>

            </div>

        </div>



        <!-- ================= PRIX ================= -->

        <div class="row mt-4">

            <div class="col-lg-8">

            </div>

            <div class="col-lg-4">

                <div class="card border-success shadow">

                    <div class="card-body text-center">

                        <h5>

                            Prix total

                        </h5>

                        <h1
                            id="totalPrice"
                            class="display-5 text-success">

                            0 €

                        </h1>

                    </div>

                </div>

            </div>

        </div>



        <!-- ================= ACTIONS ================= -->

        <div class="row mt-4">

            <div class="col text-end">

                <button
                    id="btnReset"
                    class="btn btn-outline-secondary">

                    <i class="bi bi-arrow-counterclockwise"></i>

                    Réinitialiser

                </button>

            </div>

        </div>

        <div class="row mt-3">

            <div class="col">

                <button
                    id="btnOrder"
                    class="btn btn-success w-100">

                    <i class="bi bi-cart-check"></i>

                    Ajouter au panier

                </button>

            </div>

        </div>

    </main>

<!-- ================= PANIER ================= -->

<div
    class="offcanvas offcanvas-end"
    tabindex="-1"
    id="panierCanvas">

    <div class="offcanvas-header">

        <h4>

            <i class="bi bi-cart3"></i>

            Mon panier

        </h4>

        <button
            class="btn-close"
            data-bs-dismiss="offcanvas">
        </button>

    </div>

    <div class="offcanvas-body">

        <div id="cartItems">

            <p class="text-muted">

                Votre panier est vide.

            </p>

        </div>

        <hr>

        <div class="d-flex justify-content-between">

            <strong>Total :</strong>

            <strong id="cartTotal">

                0 €

            </strong>

        </div>

        <div class="d-grid mt-4">

            <button
                class="btn btn-success"
                id="btnCheckout">

                Commander

            </button>

        </div>

    </div>

</div>

    <!-- ================= FOOTER ================= -->

    <footer class="bg-light mt-5 py-3">

        <div class="container text-center text-muted">

            Configurateur de produits © 2026

        </div>

    </footer>



    <!-- ================= SCRIPTS ================= -->

    <script type="module" src="js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
