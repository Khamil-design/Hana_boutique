<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Configurateur de produits</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Feuille de style -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- ================= HEADER ================= -->

    <header class="shadow-sm bg-dark text-white">

        <div class="container py-3">

            <h2 id="productTitle" class="mb-0">
                Chargement...
            </h2>

        </div>

    </header>


    <!-- ================= CONTENU ================= -->

    <main class="container my-4">

        <div class="row">

            <!-- IMAGE PRODUIT -->

            <div class="col-lg-5">

                <div class="card shadow-sm">

                    <img
                        id="productImage"
                        class="card-img-top img-fluid"
                        src="images/placeholder.jpg"
                        alt="Produit">

                    <div class="card-body">

                        <p id="productDescription" class="text-muted mb-0">

                            Description...

                        </p>

                    </div>

                </div>

            </div>



            <!-- CONFIGURATION -->

            <div class="col-lg-7">

                <div class="card shadow-sm">

                    <div class="card-header">

                        <h4 class="mb-0">

                            Personnalisation

                        </h4>

                    </div>

                    <div class="card-body">

                        <!--
                            Les options seront générées
                            automatiquement par JavaScript
                        -->

                        <form id="configForm">

                        </form>

                    </div>

                </div>

            </div>

        </div>



        <!-- ================= RECAP ================= -->

        <div class="row mt-4">

            <div class="col-12">

                <div class="card shadow">

                    <div class="card-header">

                        <h4 class="mb-0">

                            Récapitulatif

                        </h4>

                    </div>

                    <div class="card-body">

                        <div id="summary">

                            <!-- Généré automatiquement -->

                        </div>

                    </div>

                </div>

            </div>

        </div>



        <!-- ================= PRIX ================= -->

        <div class="row mt-4">

            <div class="col-lg-8">

            </div>

            <div class="col-lg-4">

                <div class="card border-success shadow">

                    <div class="card-body text-center">

                        <h5>

                            Prix total

                        </h5>

                        <h1
                            id="totalPrice"
                            class="display-5 text-success">

                            0 €

                        </h1>

                    </div>

                </div>

            </div>

        </div>



        <!-- ================= ACTIONS ================= -->

        <div class="row mt-4">

            <div class="col text-end">

                <button
                    id="btnReset"
                    class="btn btn-outline-secondary">

                    <i class="bi bi-arrow-counterclockwise"></i>

                    Réinitialiser

                </button>

                <button
                    id="btnOrder"
                    class="btn btn-success">

                    <i class="bi bi-cart-check"></i>

                    Commander

                </button>

            </div>

        </div>

    </main>



    <!-- ================= FOOTER ================= -->

    <footer class="bg-light mt-5 py-3">

        <div class="container text-center text-muted">

            Configurateur de produits © 2026

        </div>

    </footer>



    <!-- ================= SCRIPTS ================= -->

    <script type=module" src="js/app.js"></script>

</body>

</html>
